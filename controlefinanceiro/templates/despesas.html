  {% extends 'index.html' %}
{% block content %}
 <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Despesas</h2>

        <a href="{% url 'cadastrar_categoria' %}" class="btn btn-success">
            + Adicionar despesa
        </a></div>
  <div class="container-categorias mt-4">
    <form method="POST">
      {% csrf_token %}

<table class="table table-striped mt-4">
    <thead>
        <tr>
            <th>Data</th>
            <th>Descrição</th>
            <th>Categoria</th>
            <th>Valor</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for despesa in despesas %}
        <tr>
            <td>{{ despesa.data }}</td>
            <td>{{ despesa.descricao }}</td>
            <td>{{ despesa.categoria }}</td>
            <td>{{ despesa.valor }}</td>
            <td>
                <a href="{% url 'editar_despesa' despesa.id %}" class="btn btn-primary btn-sm">Editar</a>
                <a href="{% url 'excluir_despesa' despesa.id %}" class="btn btn-danger btn-sm">Excluir</a>
            </td>
        </tr>
        {% endfor %}
        {% endblock %}
