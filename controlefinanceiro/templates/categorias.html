{% extends 'index.html' %}
{% block content %}
 <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Categorias</h2>

        <a href="{% url 'cadastrar_categoria' %}" class="btn btn-cadastro">
            + Cadastrar Categoria
        </a></div>
 <div class="item-form border rounded p-3 mb-3">
   
    
    <table class="table table-striped mt-4">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for categoria in categorias %}
            <tr>
                <td>{{ categoria.nome }}</td>
                <td>{{ categoria.get_tipo_display }}</td>
                <td>
                    <a href="{% url 'editar_categoria' categoria.id %}" class="btn btn-primary btn-sm">Editar</a>
                    <a href="{% url 'excluir_categoria' categoria.id %}" class="btn btn-danger btn-sm">Excluir</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table></div></div>
{% endblock %}
