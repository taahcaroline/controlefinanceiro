  {% extends 'index.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Receitas</h2>

        <a href="{% url 'cadastrar_categoria' %}" class="btn btn-success">
            + Adicionar receita
        </a></div>
  <div class="container-categorias mt-4">
    <form method="POST">
      {% csrf_token %}


      <div class="container mt-4">
<table class="table table-striped mt-4">
    <thead>
        <tr>
            <th>Data</th>
            <th>Descrição</th>
            <th>Categoria</th>
            <th>Valor</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for receita in receitas %}
        <tr>
            <td>{{ receita.data }}</td>
            <td>{{ receita.descricao }}</td>
            <td>{{ receita.categoria }}</td>
            <td>{{ receita.valor }}</td>
            <td>
                <a href="{% url 'editar_receita' receita.id %}" class="btn btn-primary btn-sm">Editar</a>
                <a href="{% url 'excluir_receita' receita.id %}" class="btn btn-danger btn-sm">Excluir</a>
            </td>
        </tr>
        {% endfor %}
        {% endblock %}
