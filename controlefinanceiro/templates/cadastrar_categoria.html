{% extends 'index.html' %}

{% block content %}
<h2>Cadastrar categoria</h2>
<form method="POST">
    {% csrf_token %}
    <div>
        <label>Nome da categoria:</label>
        {{ form.nome }}
        {{ form.nome.errors }}
    </div>
    <div>
        <label>Tipo</label>
        {{ form.tipo }}
        {{ form.tipo.errors }}
    </div>
    <button type="submit">
        Salvar categoria
    </button>

    <a href="{% url 'categorias' %}">
        Cancelar
    </a>

    {% endblock %}
